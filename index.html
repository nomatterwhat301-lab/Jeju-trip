<script>

firebase.initializeApp(firebaseConfig);

const db = firebase.database();


let map;

let markers = [];

let tempMarker = null;

let accommodation = null;

let places = [];

let currentCategory = "전체";

let currentPerson = "전체";

let editingKey = null;


const FAMILY = [
  "지현",
  "지숙",
  "연정",
  "미경",
  "유리",
  "주은"
];


function initMap(){

  map = L.map("map").setView(
    [33.3617,126.5292],
    10
  );


  L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      maxZoom:19,
      attribution:"© OpenStreetMap"
    }
  ).addTo(map);


  map.on("click",function(e){

    setCoordinates(
      e.latlng.lat,
      e.latlng.lng
    );

    switchTab("add");

  });


  listenRealtimeData();

}


function listenRealtimeData(){

  db.ref("jeju_trip_data").on("value",function(snap){

    const data = snap.val() || {};

    accommodation = data.hotel || null;

    places = data.places
      ? Object.keys(data.places).map(function(key){
          return {
            key:key,
            ...data.places[key]
          };
        })
      : [];


    render();

  });

}


function switchTab(tab){

  document.getElementById("tab-list").style.display =
    tab === "list" ? "block" : "none";


  document.getElementById("tab-add").style.display =
    tab === "add" ? "block" : "none";


  document.querySelectorAll(".tab").forEach(function(button,index){

    button.classList.toggle(
      "active",
      (tab === "list" && index === 0) ||
      (tab === "add" && index === 1)
    );

  });


  setTimeout(function(){

    if(map){
      map.invalidateSize();
    }

  },100);

}


function filterCategory(category,button){

  currentCategory = category;

  document.querySelectorAll("#tab-list .filter:first-child button")
    .forEach(function(b){
      b.classList.remove("active");
    });


  button.classList.add("active");

  render();

}


function filterPerson(person,button){

  currentPerson = person;

  document.querySelectorAll("#person-filter button")
    .forEach(function(b){
      b.classList.remove("active");
    });


  button.classList.add("active");

  render();

}


function renderPickChecks(selected){

  selected = selected || [];

  const box = document.getElementById("pick-checks");

  if(!box){
    return;
  }


  box.innerHTML = FAMILY.map(function(name){

    return `
      <label class="pickcheck">

        <input
          type="checkbox"
          value="${name}"
          ${selected.includes(name) ? "checked" : ""}>

        ${name}

      </label>
    `;

  }).join("");

}


function getSelectedPicks(){

  return Array.from(
    document.querySelectorAll("#pick-checks input:checked")
  ).map(function(input){
    return input.value;
  });

}


function createCustomIcon(category){

  const icons = {

    숙소:"fa-house",

    음식점:"fa-utensils",

    카페:"fa-mug-hot",

    관광지:"fa-mountain"

  };


  return L.divIcon({

    className:"",

    html:`
      <div class="custom-pin pin-${category}">
        <i class="fa-solid ${icons[category] || "fa-location-dot"}"></i>
      </div>
    `,

    iconSize:[32,32],

    iconAnchor:[16,16]

  });

}


function setCoordinates(lat,lng){

  document.getElementById("input-lat").value =
    Number(lat).toFixed(6);


  document.getElementById("input-lng").value =
    Number(lng).toFixed(6);


  if(tempMarker){

    map.removeLayer(tempMarker);

  }


  tempMarker = L.marker(
    [lat,lng],
    {
      icon:createCustomIcon(
        document.getElementById("input-category").value
      )
    }
  ).addTo(map);

}


function getDistance(lat1,lon1,lat2,lon2){

  const R = 6371;

  const dLat =
    (lat2-lat1) * Math.PI / 180;

  const dLon =
    (lon2-lon1) * Math.PI / 180;


  const a =
    Math.sin(dLat/2) ** 2 +
    Math.cos(lat1*Math.PI/180) *
    Math.cos(lat2*Math.PI/180) *
    Math.sin(dLon/2) ** 2;


  return (
    R *
    2 *
    Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1-a)
    )
  ).toFixed(1);

}


/* =========================
   장소 검색
========================= */

async function searchPlaces(){

  const input =
    document.getElementById("place-search");

  const box =
    document.getElementById("search-results");


  const raw = input.value.trim();


  if(!raw){

    alert("검색어를 입력해주세요.");

    return;

  }


  box.innerHTML =
    "<div class='notice'>🔎 제주 장소를 검색하고 있습니다...</div>";


  const category =
    document.getElementById("input-category").value;


  const terms = [

    raw,

    raw + " 제주",

    raw + " 제주특별자치도"

  ];


  if(category === "음식점"){

    terms.push(
      raw + " 제주 맛집"
    );

  }


  if(category === "카페"){

    terms.push(
      raw + " 제주 카페"
    );

  }


  if(category === "관광지"){

    terms.push(
      raw + " 제주 관광지"
    );

  }


  let all = [];

  const seen = new Set();


  for(const query of terms){

    try{

      const url =
        "https://nominatim.openstreetmap.org/search" +
        "?format=jsonv2" +
        "&addressdetails=1" +
        "&limit=8" +
        "&countrycodes=kr" +
        "&q=" +
        encodeURIComponent(query);


      const response =
        await fetch(
          url,
          {
            headers:{
              "Accept":"application/json",
              "Accept-Language":"ko"
            }
          }
        );


      if(!response.ok){
        continue;
      }


      const data =
        await response.json();


      data.forEach(function(item){

        const isJeju =
          /제주|Jeju/i.test(
            (item.display_name || "") +
            " " +
            (item.address?.state || "")
          );


        if(
          isJeju &&
          !seen.has(item.place_id)
        ){

          seen.add(item.place_id);

          all.push(item);

        }

      });


      if(all.length >= 8){
        break;
      }


    }catch(error){

      console.error(
        "장소 검색 오류:",
        error
      );

    }

  }


  if(!all.length){

    box.innerHTML =
      "<div class='notice'>" +
      "검색 결과가 없습니다.<br>" +
      "상호명 뒤에 '제주'를 붙여 다시 검색하거나 " +
      "주소 검색을 이용해주세요." +
      "</div>";

    return;

  }


  box.innerHTML =
    all.slice(0,10).map(function(item){

      const name =
        item.name ||
        cleanName(
          item.display_name,
          item.name
        );


      const data = {
        name:name,
        address:item.display_name,
        lat:item.lat,
        lng:item.lon
      };


      return `
        <div class="search-result">

          <b>${escapeHtml(name)}</b>

          <small>
            ${escapeHtml(item.display_name)}
          </small>

          <button
            onclick='selectSearchResult(${JSON.stringify(data)})'>

            이 장소 선택

          </button>

        </div>
      `;

    }).join("");

}


function cleanName(display,name){

  return (
    name ||
    String(display || "").split(",")[0]
  );

}


function escapeHtml(value){

  return String(value || "").replace(
    /[&<>"']/g,
    function(match){

      return {

        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"

      }[match];

    }
  );

}

/* =========================
   주소 검색
========================= */

function openAddressSearch(){

  new daum.Postcode({

    oncomplete:function(data){

      document.getElementById(
        "input-address"
      ).value = data.address;


      if(
        !document.getElementById("input-name").value
      ){

        document.getElementById(
          "input-name"
        ).value =
          data.buildingName || "";

      }


      geocodeAddress(
        data.address
      );

    }

  }).open();

}


async function geocodeAddress(address){

  const queries = [

    address,

    address.replace(
      /대한민국/g,
      ""
    ).trim(),

    address + " 대한민국",

    address
      .replace(
        /제주특별자치도|제주도/g,
        ""
      )
      .trim() +
      " 제주특별자치도"

  ];


  const box =
    document.getElementById(
      "search-results"
    );


  box.innerHTML =
    "<div class='notice'>" +
    "📍 주소의 지도 위치를 찾는 중입니다..." +
    "</div>";


  for(const query of queries){

    if(!query){
      continue;
    }


    try{

      const url =
        "https://nominatim.openstreetmap.org/search" +
        "?format=jsonv2" +
        "&addressdetails=1" +
        "&limit=5" +
        "&countrycodes=kr" +
        "&q=" +
        encodeURIComponent(query);


      const response =
        await fetch(
          url,
          {
            headers:{
              "Accept":"application/json",
              "Accept-Language":"ko"
            }
          }
        );


      if(!response.ok){
        continue;
      }


      const data =
        await response.json();


      if(data && data.length){

        data.sort(function(a,b){

          const aJeju =
            /제주|Jeju/i.test(
              a.display_name || ""
            ) ? 1 : 0;


          const bJeju =
            /제주|Jeju/i.test(
              b.display_name || ""
            ) ? 1 : 0;


          return bJeju - aJeju;

        });


        const result =
          data[0];


        setCoordinates(
          Number(result.lat),
          Number(result.lon)
        );


        map.flyTo(
          [
            Number(result.lat),
            Number(result.lon)
          ],
          17
        );


        box.innerHTML =
          "<div class='notice'>" +
          "✅ 주소 위치를 찾았습니다.<br>" +
          "지도에서 위치를 확인한 뒤 저장해주세요." +
          "</div>";


        return;

      }


    }catch(error){

      console.error(
        "주소 좌표 변환 오류:",
        error
      );

    }

  }


  box.innerHTML =
    "<div class='notice'>" +
    "⚠️ 이 주소의 지도 좌표를 자동으로 찾지 못했습니다.<br>" +
    "지도에서 해당 위치를 직접 클릭하면 좌표가 입력됩니다." +
    "</div>";


  alert(
    "주소의 지도 위치를 자동으로 찾지 못했습니다. " +
    "지도에서 해당 위치를 직접 눌러주세요."
  );

}


/* =========================
   카테고리
========================= */

function toggleCategory(){

  const category =
    document.getElementById(
      "input-category"
    ).value;


  const isHotel =
    category === "숙소";


  document.getElementById(
    "detail-fields"
  ).style.display =
    isHotel ? "none" : "block";


  if(tempMarker){

    const lat =
      Number(
        document.getElementById(
          "input-lat"
        ).value
      );


    const lng =
      Number(
        document.getElementById(
          "input-lng"
        ).value
      );


    if(
      !isNaN(lat) &&
      !isNaN(lng)
    ){

      setCoordinates(
        lat,
        lng
      );

    }

  }

}


/* =========================
   저장
========================= */

function savePlace(){

  const category =
    document.getElementById(
      "input-category"
    ).value;


  const name =
    document.getElementById(
      "input-name"
    ).value.trim();


  const address =
    document.getElementById(
      "input-address"
    ).value.trim();


  const lat =
    Number(
      document.getElementById(
        "input-lat"
      ).value
    );


  const lng =
    Number(
      document.getElementById(
        "input-lng"
      ).value
    );


  if(
    !name ||
    !address ||
    isNaN(lat) ||
    isNaN(lng)
  ){

    alert(
      "장소명, 주소, 위치를 모두 등록해주세요."
    );

    return;

  }


  const payload = {

    category:category,

    name:name,

    address:address,

    lat:lat,

    lng:lng,

    rating:
      document.getElementById(
        "input-rating"
      ).value,

    noKids:
      document.getElementById(
        "input-nokids"
      ).value,

    reservation:
      document.getElementById(
        "input-reservation"
      ).value,

    breakTime:
      document.getElementById(
        "input-breaktime"
      ).value,

    offDay:
      document.getElementById(
        "input-offday"
      ).value,

    parking:
      document.getElementById(
        "input-parking"
      ).value,

    picks:getSelectedPicks(),

    memo:
      document.getElementById(
        "input-memo"
      ).value

  };


  let action;


  if(category === "숙소"){

    action =
      db.ref(
        "jeju_trip_data/hotel"
      ).set({

        name:name,

        address:address,

        lat:lat,

        lng:lng

      });

  }else if(editingKey){

    action =
      db.ref(
        "jeju_trip_data/places/" +
        editingKey
      ).set(payload);

  }else{

    action =
      db.ref(
        "jeju_trip_data/places"
      ).push(payload);

  }


  action
    .then(function(){

      clearForm();

      switchTab("list");

    })
    .catch(function(error){

      console.error(error);

      alert(
        "저장 중 오류가 발생했습니다.\n" +
        error.message
      );

    });

}


/* =========================
   입력창 초기화
========================= */

function clearForm(){

  const ids = [

    "input-address",
    "input-name",
    "input-rating",
    "input-nokids",
    "input-reservation",
    "input-breaktime",
    "input-offday",
    "input-parking",
    "input-lat",
    "input-lng",
    "place-search"

  ];


  ids.forEach(function(id){

    const element =
      document.getElementById(id);


    if(element){
      element.value = "";
    }

  });


  document.getElementById(
    "input-memo"
  ).value = "";


  document.getElementById(
    "search-results"
  ).innerHTML = "";


  renderPickChecks([]);


  editingKey = null;


  if(tempMarker){

    map.removeLayer(
      tempMarker
    );

    tempMarker = null;

  }


  const saveButton =
    document.querySelector(
      "#tab-add .btn-green"
    );


  if(saveButton){

    saveButton.textContent =
      "저장하기";

  }


  document.getElementById(
    "input-category"
  ).value =
    "음식점";


  toggleCategory();

}


/* =========================
   수정
========================= */

function editPlace(key){

  const place =
    places.find(function(item){
      return item.key === key;
    });


  if(!place){
    return;
  }


  editingKey = key;


  document.getElementById(
    "input-category"
  ).value =
    place.category || "음식점";


  document.getElementById(
    "input-name"
  ).value =
    place.name || "";


  document.getElementById(
    "input-address"
  ).value =
    place.address || "";


  document.getElementById(
    "input-rating"
  ).value =
    place.rating || "";


  document.getElementById(
    "input-nokids"
  ).value =
    place.noKids || "";


  document.getElementById(
    "input-reservation"
  ).value =
    place.reservation || "";


  document.getElementById(
    "input-breaktime"
  ).value =
    place.breakTime || "";


  document.getElementById(
    "input-offday"
  ).value =
    place.offDay || "";


  document.getElementById(
    "input-parking"
  ).value =
    place.parking || "";


  document.getElementById(
    "input-memo"
  ).value =
    place.memo || "";


  document.getElementById(
    "input-lat"
  ).value =
    place.lat || "";


  document.getElementById(
    "input-lng"
  ).value =
    place.lng || "";


  const picks =
    Array.isArray(place.picks)
      ? place.picks
      : String(
          place.picks || ""
        )
        .split(",")
        .map(function(item){
          return item.trim();
        })
        .filter(Boolean);


  renderPickChecks(picks);


  document.getElementById(
    "search-results"
  ).innerHTML =
    "<div class='notice'>" +
    "✏️ 수정 중인 장소입니다.<br>" +
    "내용을 수정한 뒤 저장하면 기존 장소가 업데이트됩니다." +
    "</div>";


  const saveButton =
    document.querySelector(
      "#tab-add .btn-green"
    );


  if(saveButton){

    saveButton.textContent =
      "수정 내용 저장";

  }


  toggleCategory();

  switchTab("add");


  setCoordinates(
    Number(place.lat),
    Number(place.lng)
  );


  map.flyTo(
    [
      Number(place.lat),
      Number(place.lng)
    ],
    16
  );

}


/* =========================
   삭제
========================= */

function deletePlace(key){

  if(
    confirm(
      "이 장소를 삭제할까요?"
    )
  ){

    db.ref(
      "jeju_trip_data/places/" +
      key
    ).remove();

  }

}


function deleteHotel(){

    confirm(
      "숙소를 삭제할까요?"
    )
  ){

    db.ref(
      "jeju_trip_data/hotel"
    ).remove();

}


/* =========================
   지도 + 장소 목록 표시
========================= */

function render(){

  if(!map){
    return;
  }


  markers.forEach(function(marker){

    map.removeLayer(marker);

  });


  markers = [];


  document.getElementById(
    "place-list"
  ).innerHTML = "";


  document.getElementById(
    "hotel-box"
  ).innerHTML = "";


  /* 숙소 */

  if(accommodation){

    const hotelCard =
      document.createElement("div");


    hotelCard.className =
      "place-card hotel";


    hotelCard.onclick =
      function(event){

        if(
          event.target.tagName !==
          "BUTTON"
        ){

          map.flyTo(
            [
              Number(accommodation.lat),
              Number(accommodation.lng)
            ],
            15
          );

        }

      };


    hotelCard.innerHTML = `

      <span class="badge badge-숙소">
        🏠 우리 숙소
      </span>

      <button
        class="delete"
        onclick="event.stopPropagation();deleteHotel()">

        삭제

      </button>

      <div class="title">
        ${escapeHtml(accommodation.name)}
      </div>

      <div class="meta">
        ${escapeHtml(accommodation.address || "")}
      </div>

    `;


    document.getElementById(
      "hotel-box"
    ).appendChild(hotelCard);


    markers.push(

      L.marker(
        [
          Number(accommodation.lat),
          Number(accommodation.lng)
        ],
        {
          icon:createCustomIcon("숙소")
        }
      )
      .addTo(map)
      .bindPopup(
        "<b>🏠 " +
        escapeHtml(accommodation.name) +
        "</b>"
      )

    );

  }


  /* 카테고리 필터 */

  let filteredPlaces =
    currentCategory === "전체"
      ? places
      : places.filter(function(place){

          return (
            place.category ===
            currentCategory
          );

        });


  /* 사람 필터 */

  if(currentPerson !== "전체"){

    filteredPlaces =
      filteredPlaces.filter(
        function(place){

          const pickArray =
            Array.isArray(place.picks)
              ? place.picks
              : String(
                  place.picks || ""
                )
                .split(",")
                .map(function(item){
                  return item.trim();
                })
                .filter(Boolean);


          return pickArray.includes(
            currentPerson
          );

        }
      );

  }


  if(!filteredPlaces.length){

    document.getElementById(
      "place-list"
    ).innerHTML =
      "<div class='empty'>" +
      "아직 등록된 장소가 없어요.<br>" +
      "장소 추가에서 검색해보세요." +
      "</div>";

  }


  filteredPlaces.forEach(function(place){

    const distance =
      accommodation
        ? "🏠 숙소에서 약 " +
          getDistance(
            Number(accommodation.lat),
            Number(accommodation.lng),
            Number(place.lat),
            Number(place.lng)
          ) +
          " km"
        : "숙소를 등록하면 거리가 표시됩니다";


    const pickArray =
      Array.isArray(place.picks)
        ? place.picks
        : String(
            place.picks || ""
          )
          .split(",")
          .map(function(item){
            return item.trim();
          })
          .filter(Boolean);


    const picks =
      pickArray.map(function(person){

        return `
          <span class="pick">
            ❤️ ${escapeHtml(person)}
          </span>
        `;

      }).join("");


    const card =
      document.createElement("div");


    card.className =
      "place-card";


    card.onclick =
      function(event){

        if(
          event.target.tagName !==
          "BUTTON"
        ){

          map.flyTo(
            [
              Number(place.lat),
              Number(place.lng)
            ],
            16
          );

        }

      };


    card.innerHTML = `

      <span class="badge badge-${place.category}">
        ${escapeHtml(place.category)}
      </span>

      <button
        class="edit"
        onclick="event.stopPropagation();editPlace('${place.key}')">

        수정

      </button>

      <button
        class="delete"
        onclick="event.stopPropagation();deletePlace('${place.key}')">

        삭제

      </button>

      <div class="title">

        ${escapeHtml(place.name)}

        <span class="rating">

          ${
            place.rating
              ? "★ " +
                escapeHtml(place.rating)
              : ""
          }

        </span>

      </div>


      <div class="meta">

        ${escapeHtml(place.address || "")}
        <br>

        👶 노키즈:
        ${escapeHtml(place.noKids || "-")}

        ·

        📅 예약:
        ${escapeHtml(place.reservation || "-")}

        <br>

        ☕ 브레이크:
        ${escapeHtml(place.breakTime || "-")}

        ·

        🚫 휴무:
        ${escapeHtml(place.offDay || "-")}

        <br>

        🚗 주차:
        ${escapeHtml(place.parking || "-")}

        <br>

        ${
          place.memo
            ? "📝 " +
              escapeHtml(place.memo) +
              "<br>"
            : ""
        }

        ${picks}

      </div>


      <div class="distance">
        ${distance}
      </div>

    `;


    document.getElementById(
      "place-list"
    ).appendChild(card);


    const popup = `

      <b>
        ${escapeHtml(place.name)}
      </b>

      <br>

      📍
      ${escapeHtml(place.category)}

      <br>

      ${
        place.rating
          ? "⭐ " +
            escapeHtml(place.rating) +
            "<br>"
          : ""
      }

      ${
        pickArray.length
          ? "❤️ " +
            escapeHtml(
              pickArray.join(", ")
            ) +
            "<br>"
          : ""
      }

      ${
        place.parking
          ? "🚗 주차: " +
            escapeHtml(place.parking) +
            "<br>"
          : ""
      }

      ${
        accommodation
          ? "🏠 숙소에서 " +
            getDistance(
              Number(accommodation.lat),
              Number(accommodation.lng),
              Number(place.lat),
              Number(place.lng)
            ) +
            " km"
          : ""
      }

    `;


    markers.push(

      L.marker(
        [
          Number(place.lat),
          Number(place.lng)
        ],
        {
          icon:createCustomIcon(
            place.category
          )
        }
      )
      .addTo(map)
      .bindPopup(popup)

    );

  });

}
