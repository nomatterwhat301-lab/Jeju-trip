<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>우리 가족 제주도 여행🌴</title>
    <script async defer src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAndcXXxmTbZO-HkdFfOuQyl5MniHISmKs&libraries=places&language=ko"></script>
    <style>
        :root { --primary: #FF5E5B; --primary-light: #FFF0F0; --bg-color: #F8F9FA; --text-main: #2D3436; --text-sub: #636E72; --border-color: #DFE6E9; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, sans-serif; }
        body { background: var(--bg-color); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }
        header { display: flex; align-items: center; justify-content: space-between; background: #ffffff; padding: 14px 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.03); }
        .add-place-trigger { background: var(--primary); border: none; color: white; padding: 8px 14px; border-radius: 20px; font-weight: 600; cursor: pointer; }
        .main-tab-bar { display: flex; background: #ffffff; padding: 10px 16px; gap: 8px; overflow-x: auto; }
        .tab-btn { flex: 1; padding: 10px 14px; border: none; background: #F1F2F6; border-radius: 12px; font-weight: 600; cursor: pointer; color: var(--text-sub); white-space: nowrap; }
        .tab-btn.active { background: var(--text-main); color: white; }
        .side-panel { position: fixed; top: 0; left: -100%; width: 100%; max-width: 380px; height: 100%; background: white; z-index: 2000; transition: 0.35s; overflow-y: auto; padding: 24px; box-shadow: 10px 0 30px rgba(0,0,0,0.1); }
        .side-panel.active { left: 0; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 700; margin-bottom: 8px; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 12px; }
        .time-group { display: flex; gap: 8px; align-items: center; }
        .card-item { background: white; padding: 16px; border-radius: 16px; margin: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); }
        .heart-btn { font-size: 1.2rem; cursor: pointer; background: none; border: none; }
        #map { width: 100%; height: 200px; border-radius: 12px; margin-bottom: 15px; background: #e5e3df; }
    </style>
</head>
<body>
    <header>
        <h1>우리 가족 제주도 여행 ✈️</h1>
        <button class="add-place-trigger" onclick="openSidebar()">+ 장소추가</button>
    </header>

    <div class="main-tab-bar">
        <button class="tab-btn active" onclick="setTab('List')">List</button>
        <button class="tab-btn" onclick="setTab('Day 1')">Day 1</button>
        <button class="tab-btn" onclick="setTab('Day 2')">Day 2</button>
    </div>

    <aside id="sidePanel" class="side-panel">
        <h2 id="panelTitle">장소 등록</h2>
        <form id="placeForm">
            <div id="map"></div>
            <div class="form-group"><label>장소 명칭</label><input type="text" id="placeName" required></div>
            <div class="form-group">
                <label>운영 시간</label>
                <div class="time-group"><input type="time" id="openTime"> ~ <input type="time" id="closeTime"></div>
            </div>
            <div class="form-group">
                <label>브레이크 타임</label>
                <div class="time-group"><input type="time" id="breakStart"> ~ <input type="time" id="breakEnd"></div>
            </div>
            <div class="form-group">
                <label>휴무일</label>
                <select id="closedDay">
                    <option value="없음">없음</option><option value="월요일">월요일</option>
                    <option value="화요일">화요일</option><option value="수요일">수요일</option>
                    <option value="목요일">목요일</option><option value="금요일">금요일</option>
                    <option value="토요일">토요일</option><option value="일요일">일요일</option>
                </select>
            </div>
            <button type="submit" style="width:100%; padding:14px; background:var(--primary); color:white; border:none; border-radius:12px; font-weight:700;">저장하기</button>
        </form>
    </aside>

    <main id="cardsList"></main>

    <script>
        let places = JSON.parse(localStorage.getItem('jeju_places')) || [];
        let currentTab = 'List';
        const MY_NAME = "유리";

        function render() {
            const container = document.getElementById('cardsList');
            container.innerHTML = '';
            const list = (currentTab === 'List') ? places : places.filter(p => p.schedule === currentTab);
            
            list.forEach(p => {
                const isVoted = (p.voters || []).includes(MY_NAME);
                const card = document.createElement('div');
                card.className = 'card-item';
                card.innerHTML = `
                    <h3>${p.name}</h3>
                    <p style="font-size:0.85rem; color:#636E72;">
                        운영: ${p.openTime || ''}~${p.closeTime || ''}<br>
                        브레이크: ${p.breakStart || ''}~${p.breakEnd || ''}<br>
                        휴무: ${p.closedDay || '없음'}
                    </p>
                    <div style="display:flex; justify-content:space-between; align-items:center; margin-top:12px;">
                        <button class="heart-btn" onclick="toggleVote(${p.id})">
                            ${isVoted ? '❤️' : '🤍'} ${(p.voters || []).length}
                        </button>
                        <button onclick="del(${p.id})">삭제</button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        window.toggleVote = (id) => {
            const p = places.find(x => x.id === id);
            if(!p.voters) p.voters = [];
            const idx = p.voters.indexOf(MY_NAME);
            idx > -1 ? p.voters.splice(idx, 1) : p.voters.push(MY_NAME);
            localStorage.setItem('jeju_places', JSON.stringify(places));
            render();
        };

        document.getElementById('placeForm').onsubmit = (e) => {
            e.preventDefault();
            places.push({
                id: Date.now(),
                name: document.getElementById('placeName').value,
                schedule: 'Day 1',
                openTime: document.getElementById('openTime').value,
                closeTime: document.getElementById('closeTime').value,
                breakStart: document.getElementById('breakStart').value,
                breakEnd: document.getElementById('breakEnd').value,
                closedDay: document.getElementById('closedDay').value,
                voters: []
            });
            localStorage.setItem('jeju_places', JSON.stringify(places));
            document.getElementById('sidePanel').classList.remove('active');
            render();
        };

        function openSidebar() { document.getElementById('sidePanel').classList.add('active'); }
        function setTab(t) { currentTab = t; render(); }
        function del(id) { places = places.filter(x => x.id !== id); localStorage.setItem('jeju_places', JSON.stringify(places)); render(); }
        
        render();
    </script>
</body>
</html>
