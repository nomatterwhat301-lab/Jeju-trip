<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>우리 가족 제주 여행 지도 (실시간 동기화)</title>
  
  <!-- Leaflet 지도 & FontAwesome 아이콘 CDN -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Malgun Gothic', sans-serif; }
    body { display: flex; height: 100vh; overflow: hidden; background: #f8f9fa; }

    #sidebar {
      width: 420px; height: 100%; background: #ffffff;
      border-right: 1px solid #dee2e6; display: flex; flex-direction: column;
      z-index: 1000; box-shadow: 2px 0 10px rgba(0,0,0,0.05);
    }
    .header { padding: 18px; background: #007bff; color: white; }
    .header h1 { font-size: 18px; margin-bottom: 4px; }
    
    .tab-group { display: flex; background: #e9ecef; border-bottom: 1px solid #dee2e6; }
    .tab-btn { flex: 1; padding: 10px; border: none; background: none; font-weight: bold; cursor: pointer; color: #495057; }
    .tab-btn.active { background: white; color: #007bff; border-bottom: 3px solid #007bff; }

    .content-body { flex: 1; overflow-y: auto; padding: 15px; }

    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 12px; font-weight: bold; color: #495057; margin-bottom: 4px; }
    .form-control { width: 100%; padding: 8px 10px; font-size: 13px; border: 1px solid #ced4da; border-radius: 4px; }
    
    .search-box { display: flex; gap: 5px; }
    .btn-search { padding: 8px 12px; background: #17a2b8; color: white; border: none; border-radius: 4px; font-size: 12px; font-weight: bold; cursor: pointer; white-space: nowrap; }
    .btn-search:hover { background: #138496; }

    .btn-submit { width: 100%; padding: 10px; background: #28a745; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 5px; }
    .btn-submit:hover { background: #218838; }

    .filter-group { display: flex; gap: 4px; margin-bottom: 12px; }
    .filter-btn { flex: 1; padding: 6px; font-size: 12px; border: 1px solid #007bff; background: white; color: #007bff; border-radius: 4px; cursor: pointer; }
    .filter-btn.active { background: #007bff; color: white; }

    .place-card { background: white; border: 1px solid #e0e0e0; border-radius: 8px; padding: 12px; margin-bottom: 10px; cursor: pointer; position: relative; }
    .place-card:hover { border-color: #007bff; }
    .badge { display: inline-block; padding: 2px 6px; font-size: 11px; border-radius: 10px; color: white; font-weight: bold; margin-bottom: 5px; }
    .badge-음식점 { background: #8a2be2; }
    .badge-카페 { background: #8b4513; }
    .badge-관광지 { background: #007bff; }
    .badge-숙소 { background: #e83e8c; }

    .card-title { font-size: 15px; font-weight: bold; display: flex; justify-content: space-between; }
    .rating { color: #f39c12; }
    .info-grid { font-size: 12px; color: #6c757d; margin-top: 6px; display: grid; gap: 2px; }
    .dist-tag { margin-top: 6px; padding: 4px; background: #e7f5ff; color: #1971c2; font-size: 11px; text-align: center; border-radius: 4px; font-weight: bold; }

    .btn-delete { position: absolute; top: 10px; right: 10px; background: #dc3545; color: white; border: none; padding: 2px 6px; font-size: 11px; border-radius: 3px; cursor: pointer; }

    .custom-pin {
      display: flex; align-items: center; justify-content: center;
      width: 32px; height: 32px; border-radius: 50%; color: white;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3); border: 2px solid white;
      font-size: 14px;
    }
    .pin-숙소 { background-color: #e83e8c; }
    .pin-음식점 { background-color: #8a2be2; }
    .pin-카페 { background-color: #8b4513; }
    .pin-관광지 { background-color: #007bff; }

    #map { flex: 1; height: 100vh; width: 100%; z-index: 1; }
  </style>
</head>
<body>

  <div id="sidebar">
    <div class="header">
      <h1>🌴 제주도 가족 여행 가이드</h1>
      <p style="font-size: 11px; opacity: 0.9;">🔴 실시간 가족 동기화 모드 작동 중</p>
    </div>

    <div class="tab-group">
      <button class="tab-btn active" onclick="switchTab('list')">장소 목록</button>
      <button class="tab-btn" onclick="switchTab('add')">➕ 장소/숙소 추가</button>
    </div>

    <div id="tab-list" class="content-body">
      <div class="filter-group">
        <button class="filter-btn active" onclick="filterCategory('전체')">전체</button>
        <button class="filter-btn" onclick="filterCategory('음식점')">음식점</button>
        <button class="filter-btn" onclick="filterCategory('카페')">카페</button>
        <button class="filter-btn" onclick="filterCategory('관광지')">관광지</button>
      </div>
      <div id="hotel-info-box"></div>
      <div id="place-list-container"></div>
    </div>

    <div id="tab-add" class="content-body" style="display: none;">
      <div class="form-group">
        <label>구분</label>
        <select id="input-category" class="form-control" onchange="toggleHotelMode()">
          <option value="음식점">음식점</option>
          <option value="카페">카페</option>
          <option value="관광지">관광지</option>
          <option value="숙소">🏠 숙소 (기준점)</option>
        </select>
      </div>

      <div class="form-group">
        <label>장소명 또는 주소 검색</label>
        <div class="search-box">
          <input type="text" id="input-name" class="form-control" placeholder="예: 제주신라호텔, 성산일출봉" onkeypress="if(event.keyCode==13) searchLocation()">
          <button type="button" class="btn-search" onclick="searchLocation()">🔍 검색</button>
        </div>
      </div>

      <div class="form-group" id="group-rating">
        <label>별점</label>
        <input type="number" step="0.1" id="input-rating" class="form-control" placeholder="4.5">
      </div>

      <div class="form-group" id="group-nokids">
        <label>노키즈존 여부</label>
        <input type="text" id="input-nokids" class="form-control" placeholder="예: YES존 / 노키즈존">
      </div>

      <div class="form-group" id="group-reservation">
        <label>예약 가능 여부</label>
        <input type="text" id="input-reservation" class="form-control" placeholder="예: 캐치테이블 / 전화예약">
      </div>

      <div class="form-group" id="group-breaktime">
        <label>브레이크 타임</label>
        <input type="text" id="input-breaktime" class="form-control" placeholder="예: 15:00 ~ 16:30">
      </div>

      <div class="form-group" id="group-offday">
        <label>휴무일</label>
        <input type="text" id="input-offday" class="form-control" placeholder="예: 매주 수요일 / 연중무휴">
      </div>

      <div style="display: flex; gap: 5px;">
        <div class="form-group" style="flex:1;">
          <label>위도 (Lat)</label>
          <input type="text" id="input-lat" class="form-control" placeholder="지도 클릭/검색 시 자동입력" readonly>
        </div>
        <div class="form-group" style="flex:1;">
          <label>경도 (Lng)</label>
          <input type="text" id="input-lng" class="form-control" placeholder="지도 클릭/검색 시 자동입력" readonly>
        </div>
      </div>

      <button class="btn-submit" onclick="savePlace()">저장하기</button>
    </div>
  </div>

  <div id="map"></div>

  <!-- Leaflet 지도 라이브러리 -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Firebase 실시간 DB 라이브러리 -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyCqzu-A6-woxTIStlwXOXk3N5hT0WrVa14",
      authDomain: "jeju-trip-3dd23.firebaseapp.com",
      databaseURL: "https://jeju-trip-3dd23-default-rtdb.firebaseio.com",
      projectId: "jeju-trip-3dd23",
      storageBucket: "jeju-trip-3dd23.firebasestorage.app",
      messagingSenderId: "647159148234",
      appId: "1:647159148234:web:1780f7619ed3cc1a2a4e33",
      measurementId: "G-9E3M0372M6"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let map, markers = [];
    let tempMarker = null;
    let accommodation = null;
    let places = [];
    let currentCategory = '전체';

    function initMap() {
      map = L.map('map').setView([33.3617, 126.5292], 10);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19, attribution: '© OpenStreetMap'
      }).addTo(map);

      map.on('click', function(e) {
        setCoordinates(e.latlng.lat, e.latlng.lng);
        switchTab('add');
      });

      listenRealtimeData();
    }

    function listenRealtimeData() {
      db.ref('jeju_trip_data').on('value', (snapshot) => {
        const data = snapshot.val() || {};
        accommodation = data.hotel || null;
        
        if (data.places) {
          places = Object.keys(data.places).map(key => ({
            key: key,
            ...data.places[key]
          }));
        } else {
          places = [];
        }
        render();
      });
    }

    function createCustomIcon(category) {
      let iconClass = '';
      if (category === '숙소') iconClass = 'fa-solid fa-house';
      else if (category === '음식점') iconClass = 'fa-solid fa-utensils';
      else if (category === '카페') iconClass = 'fa-solid fa-mug-hot';
      else if (category === '관광지') iconClass = 'fa-solid fa-mountain';

      return L.divIcon({
        className: 'custom-icon-wrap',
        html: `<div class="custom-pin pin-${category}"><i class="${iconClass}"></i></div>`,
        iconSize: [32, 32],
        iconAnchor: [16, 16]
      });
    }

    // 오픈 장소 검색 엔진 (오류 없는 대체 검색 기능)
    function searchLocation() {
      const keyword = document.getElementById('input-name').value;
      if (!keyword.trim()) return alert('검색어를 입력해주세요.');

      const query = keyword.includes('제주') ? keyword : `제주 ${keyword}`;
      const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`;

      fetch(url)
        .then(res => res.json())
        .then(data => {
          if (data && data.length > 0) {
            const result = data[0];
            const lat = parseFloat(result.lat);
            const lng = parseFloat(result.lon);
            
            setCoordinates(lat, lng);
            map.flyTo([lat, lng], 14);
          } else {
            alert('장소를 찾을 수 없습니다. 지도를 직접 클릭하여 위치를 지정해주세요.');
          }
        })
        .catch(() => alert('검색 중 오류가 발생했습니다. 지도를 클릭해서 위치를 지정해보세요.'));
    }

    function setCoordinates(lat, lng) {
      document.getElementById('input-lat').value = lat.toFixed(6);
      document.getElementById('input-lng').value = lng.toFixed(6);

      if (tempMarker) map.removeLayer(tempMarker);
      const cat = document.getElementById('input-category').value;
      tempMarker = L.marker([lat, lng], { icon: createCustomIcon(cat) }).addTo(map);
    }

    function getDistance(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Math.sin(dLon/2) * Math.sin(dLon/2);
      return (R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a))).toFixed(1);
    }

    function render() {
      markers.forEach(m => map.removeLayer(m));
      if (tempMarker) map.removeLayer(tempMarker);
      markers = [];

      const listContainer = document.getElementById('place-list-container');
      const hotelBox = document.getElementById('hotel-info-box');
      listContainer.innerHTML = '';
      hotelBox.innerHTML = '';

      if (accommodation) {
        hotelBox.innerHTML = `
          <div class="place-card" style="background:#fce4ec; border-color:#e83e8c;">
            <span class="badge badge-숙소">우리 숙소</span>
            <div class="card-title">${accommodation.name}</div>
            <button class="btn-delete" onclick="deleteHotel()">삭제</button>
          </div>
        `;
        const hotelMarker = L.marker([accommodation.lat, accommodation.lng], {
          icon: createCustomIcon('숙소')
        }).addTo(map).bindPopup(`<b>🏠 숙소: ${accommodation.name}</b>`);
        markers.push(hotelMarker);
      }

      const filtered = currentCategory === '전체' ? places : places.filter(p => p.category === currentCategory);

      filtered.forEach((p) => {
        let distText = accommodation ? `🏠 숙소로부터 약 ${getDistance(accommodation.lat, accommodation.lng, p.lat, p.lng)} km` : "숙소를 등록하면 거리가 표시됩니다";

        const card = document.createElement('div');
        card.className = 'place-card';
        card.onclick = (e) => {
          if(e.target.tagName !== 'BUTTON') map.flyTo([p.lat, p.lng], 14);
        };

        card.innerHTML = `
          <span class="badge badge-${p.category}">${p.category}</span>
          <button class="btn-delete" onclick="deletePlace('${p.key}')">삭제</button>
          <div class="card-title">${p.name} <span class="rating">★ ${p.rating || '-'}</span></div>
          <div class="info-grid">
            <div>• 노키즈: ${p.noKids || '-'}</div>
            <div>• 예약: ${p.reservation || '-'}</div>
            <div>• 브레이크: ${p.breakTime || '-'}</div>
            <div>• 휴무: ${p.offDay || '-'}</div>
          </div>
          <div class="dist-tag">${distText}</div>
        `;
        listContainer.appendChild(card);

        const marker = L.marker([p.lat, p.lng], {
          icon: createCustomIcon(p.category)
        }).addTo(map).bindPopup(`<b>${p.name}</b><br>★ ${p.rating}<br>${p.category}`);
        
        markers.push(marker);
      });
    }

    function savePlace() {
      const category = document.getElementById('input-category').value;
      const name = document.getElementById('input-name').value;
      const lat = parseFloat(document.getElementById('input-lat').value);
      const lng = parseFloat(document.getElementById('input-lng').value);

      if (!name || isNaN(lat) || isNaN(lng)) return alert('위치를 설정해주세요!');

      if (category === '숙소') {
        db.ref('jeju_trip_data/hotel').set({ name, lat, lng });
      } else {
        const newPlace = {
          category, name, lat, lng,
          rating: document.getElementById('input-rating').value,
          noKids: document.getElementById('input-nokids').value,
          reservation: document.getElementById('input-reservation').value,
          breakTime: document.getElementById('input-breaktime').value,
          offDay: document.getElementById('input-offday').value
        };
        db.ref('jeju_trip_data/places').push(newPlace);
      }

      clearForm();
      switchTab('list');
    }

    function deletePlace(key) {
      db.ref(`jeju_trip_data/places/${key}`).remove();
    }

    function deleteHotel() {
      db.ref('jeju_trip_data/hotel').remove();
    }

    function switchTab(tab) {
      document.getElementById('tab-list').style.display = tab === 'list' ? 'block' : 'none';
      document.getElementById('tab-add').style.display = tab === 'add' ? 'block' : 'none';
      document.querySelectorAll('.tab-btn').forEach((btn, idx) => {
        btn.classList.toggle('active', (tab === 'list' && idx === 0) || (tab === 'add' && idx === 1));
      });
    }

    function filterCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.toggle('active', btn.innerText === cat);
      });
      render();
    }

    function toggleHotelMode() {
      const isHotel = document.getElementById('input-category').value === '숙소';
      ['group-rating', 'group-nokids', 'group-reservation', 'group-breaktime', 'group-offday'].forEach(id => {
        document.getElementById(id).style.display = isHotel ? 'none' : 'block';
      });
    }

    function clearForm() {
      document.querySelectorAll('#tab-add input').forEach(i => i.value = '');
    }

    window.onload = initMap;
  </script>
</body>
</html>
