<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>제주도 가족 여행 지도 🌴</title>
    <link rel="stylesheet" href="style.css">
    <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=49577ff7c6dd4420df5a86290f68d61c"></script>
</head>
<body>
    <header>
        <h1>제주도 가족 여행 🌴</h1>
    </header>
    <main>
        <div id="map"></div>
        <div class="controls">
            <select id="dayFilter"><option value="all">일정별 보기</option><option value="day1">1일차</option><option value="day2">2일차</option><option value="day3">3일차</option></select>
            <button id="addBtn" class="primary-btn">+ 새 장소 추가</button>
        </div>
        <div id="placeCards"></div>
    </main>

    <div id="placeModal" class="modal">
        <div class="modal-content">
            <h2 id="modalTitle">장소 추가</h2>
            <form id="placeForm">
                <input type="hidden" id="placeId">
                <input type="text" id="name" placeholder="장소 이름" required>
                <select id="category"><option value="lodging">숙소</option><option value="restaurant">음식점</option><option value="cafe">카페</option><option value="tour">관광지</option></select>
                <select id="schedule"><option value="day1">1일차</option><option value="day2">2일차</option><option value="day3">3일차</option></select>
                <select id="picker"><option value="지현">지현</option><option value="지숙">지숙</option><option value="연정">연정</option><option value="미경">미경</option><option value="유리">유리</option><option value="주은">주은</option></select>
                <input type="number" id="rating" placeholder="별점 (1~5)" min="1" max="5" step="0.5">
                <input type="text" id="reservation" placeholder="예약 가능 여부">
                <input type="text" id="hours" placeholder="영업시간 / 휴무일">
                <label><input type="checkbox" id="noKids"> 노키즈존</label>
                <textarea id="memo" placeholder="메모"></textarea>
                <input type="text" id="lat" placeholder="위도 (예: 33.45)" required>
                <input type="text" id="lng" placeholder="경도 (예: 126.57)" required>
                <button type="submit" class="primary-btn">저장하기</button>
            </form>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
