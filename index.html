<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>우리 여행 제주도 여행🌴</title>
    <link rel="stylesheet" href="style.css">
    <!-- 카카오 지도 API (autoload=false 옵션을 주어 확실하게 제어) -->
    <script type="text/javascript" src="//dapi.kakao.com/v2/maps/sdk.js?appkey=49577ff7c6dd4420df5a86290f68d61c&libraries=services&autoload=false"></script>
</head>
<body>
    <!-- 상단 타이틀 바 -->
    <header>
        <button id="menuBtn" class="menu-btn">☰</button>
        <h1>우리 여행 제주도 여행🌴</h1>
    </header>

    <!-- 햄버거 메뉴를 누르면 열리는 장소 등록/수정 패널 -->
    <aside id="sidePanel" class="side-panel">
        <div class="panel-header">
            <h2>장소 선택 및 등록</h2>
            <button id="closeBtn" class="close-btn">&times;</button>
        </div>
        
        <form id="placeForm" class="panel-form">
            <!-- 일정 선택 (Day 1, 2, 3) -->
            <div class="form-group">
                <label>일정</label>
                <div class="btn-select-group" id="scheduleGroup">
                    <button type="button" class="sel-btn active" data-value="day1">Day 1</button>
                    <button type="button" class="sel-btn" data-value="day2">Day 2</button>
                    <button type="button" class="sel-btn" data-value="day3">Day 3</button>
                </div>
                <input type="hidden" id="selectedSchedule" value="day1">
            </div>

            <!-- 카테고리 선택 -->
            <div class="form-group">
                <label>카테고리</label>
                <div class="btn-select-group" id="categoryGroup">
                    <button type="button" class="sel-btn active" data-value="lodging">숙소🏠</button>
                    <button type="button" class="sel-btn" data-value="restaurant">음식점🥢</button>
                    <button type="button" class="sel-btn" data-value="cafe">카페☕</button>
                    <button type="button" class="sel-btn" data-value="tour">관광지🌴</button>
                </div>
                <input type="hidden" id="selectedCategory" value="lodging">
            </div>

            <!-- 픽한 사람 -->
            <div class="form-group">
                <label>참여 가족 (Pick)</label>
                <div class="tag-select-group" id="pickerGroup">
                    <button type="button" class="tag-btn" data-value="지현">지현</button>
                    <button type="button" class="tag-btn" data-value="지숙">지숙</button>
                    <button type="button" class="tag-btn" data-value="연정">연정</button>
                    <button type="button" class="tag-btn" data-value="미경">미경</button>
                    <button type="button" class="tag-btn" data-value="유리">유리</button>
                    <button type="button" class="tag-btn" data-value="주은">주은</button>
                </div>
                <input type="hidden" id="selectedPicker" value="유리">
            </div>

            <!-- 장소 검색 -->
            <div class="form-group">
                <label>장소 검색 (주소/명칭)</label>
                <div class="search-row">
                    <input type="text" id="searchInput" placeholder="예: 애월 카페, 흑돼지">
                    <button type="button" onclick="searchPlaceKeyword()" class="sub-btn">검색</button>
                </div>
            </div>

            <div class="form-group">
                <label>선택된 장소 이름</label>
                <input type="text" id="placeName" placeholder="검색해서 장소를 선택하세요" required readonly>
                <input type="hidden" id="lat">
                <input type="hidden" id="lng">
            </div>

            <!-- 별점 -->
            <div class="form-group">
                <label>별점 (1 ~ 5)</label>
                <input type="number" id="rating" min="1" max="5" step="0.5" value="5">
            </div>

            <!-- 예약 관련 -->
            <div class="form-group">
                <label>예약 방법</label>
                <div class="checkbox-group">
                    <label><input type="checkbox" name="res" value="네이버"> 네이버</label>
                    <label><input type="checkbox" name="res" value="테이블링"> 테이블링</label>
                    <label><input type="checkbox" name="res" value="캐치테이블"> 캐치테이블</label>
                    <label><input type="checkbox" name="res" value="전화"> 전화</label>
                </div>
            </div>

            <!-- 운영 정보 -->
            <div class="form-group">
                <label>운영 정보</label>
                <input type="text" id="hours" placeholder="운영 시간 (예: 10:00 ~ 20:00)">
                <input type="text" id="breakTime" placeholder="브레이크 타임">
                <input type="text" id="closedDay" placeholder="휴무 여부 (예: 수요일 휴무)">
            </div>

            <!-- 노키즈존 -->
            <div class="form-group">
                <label>노키즈존 여부</label>
                <div class="radio-group">
                    <label><input type="radio" name="noKids" value="yes"> YES</label>
                    <label><input type="radio" name="noKids" value="no" checked> NO</label>
                </div>
            </div>

            <!-- 투표 -->
            <div class="form-group">
                <label>가족 투표</label>
                <div class="tag-select-group" id="votersGroup">
                    <button type="button" class="vote-tag" data-name="지현">지현</button>
                    <button type="button" class="vote-tag" data-name="지숙">지숙</button>
                    <button type="button" class="vote-tag" data-name="연정">연정</button>
                    <button type="button" class="vote-tag" data-name="미경">미경</button>
                    <button type="button" class="vote-tag" data-name="유리">유리</button>
                    <button type="button" class="vote-tag" data-name="주은">주은</button>
                </div>
            </div>

            <!-- 메모 -->
            <div class="form-group">
                <label>메모</label>
                <textarea id="memo" placeholder="가족들에게 남길 메모"></textarea>
            </div>

            <button type="submit" class="primary-btn">저장하기</button>
        </form>
    </aside>

    <!-- 메인 화면 (지도가 화면 전체를 꽉 채우도록 설정) -->
    <main>
        <div id="map"></div>
        <div id="placeListContainer" class="place-list-view">
            <h2>우리 가족 픽한 장소들</h2>
            <div id="cardsList"></div>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
